<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musavvir Print Calculator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playball&family=VT323&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'nokia-green': '#9bb48f',
                        'nokia-dark': '#2a3b22',
                        'musavvir-pink': '#e5005c',
                        'musavvir-dark': '#610027',
                        'calc-bg': '#f0ede6',
                        'calc-dark': '#2c2c2c',
                        'calc-gray': '#a3a3a3'
                    },
                    fontFamily: {
                        'logo': ['Playball', 'cursive'],
                        'screen': ['VT323', 'monospace'],
                        'sans': ['Space Grotesk', 'sans-serif']
                    },
                    boxShadow: {
                        'retro': '6px 6px 0px 0px rgba(44, 44, 44, 1)',
                        'inner-screen': 'inset 4px 4px 10px rgba(0,0,0,0.3), inset -2px -2px 5px rgba(255,255,255,0.2)'
                    }
                }
            }
        }
    </script>
    
    <style>
        .scanline {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
        }
        
        .cursor-blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        
        .tactile-input {
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
            border: 2px solid #a3a3a3;
            transition: all 0.2s ease;
        }
        
        .tactile-input:focus {
            outline: none;
            border-color: #e5005c;
            box-shadow: inset 2px 2px 5px rgba(229,0,92,0.15);
        }
        
        .retro-btn {
            background-color: #e5005c;
            color: white;
            border: 2px solid #610027;
            box-shadow: 4px 4px 0px #610027;
            transition: all 0.1s;
        }
        
        .retro-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #610027;
        }
    </style>
</head>

        <!-- Nokia-style Screen -->
        <div class="bg-nokia-green rounded-xl p-4 mb-8 relative overflow-hidden flex flex-col border-4 border-[#7a996b] min-h-[14rem] shadow-inner-screen">
            <div class="scanline absolute inset-0 z-10 opacity-40"></div>
            
            <div class="relative z-20 flex flex-col h-full font-screen text-nokia-dark flex-grow">
                <!-- Top Status bar -->
                <div class="flex justify-between items-center text-xl mb-2 opacity-90 border-b-2 border-nokia-dark pb-1 font-bold tracking-widest uppercase">
                    <span>FRMT: <span id="display-format">10X15</span></span>
                    <span>DONASI: <span id="display-unit-price">0</span></span>
                </div>

                <!-- Main Price Display -->
                <div class="flex-grow flex flex-col justify-center items-end py-2">
                    <div class="text-2xl opacity-80 mb-1 font-bold">Jami:</div>
                    <div class="text-6xl md:text-7xl leading-none flex items-end">
                        <span id="display-price">0</span>
                        <span class="text-4xl ml-1 mb-1 cursor-blink">_</span>
                    </div>
                    <div class="text-2xl opacity-90 mt-1 font-bold">so'm</div>
                </div>

                <!-- Free Delivery Badge -->
                <div id="delivery-badge-container" class="mt-auto h-[48px] flex items-end justify-center overflow-hidden">
                    <div id="delivery-badge" class="w-full bg-nokia-dark text-nokia-green px-2 py-2 text-base md:text-lg text-center transform transition-all duration-300 translate-y-full opacity-0 rounded font-bold leading-tight">
                        Siz uchun yetkazib berish bepul 🚚
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="space-y-5 relative z-20">
            
            <!-- Format Selector -->
            <div>
                <label class="block text-sm font-bold text-calc-dark mb-1 ml-2 uppercase tracking-wider">Format</label>
                <div class="relative">
                    <select id="format-select" class="tactile-input w-full appearance-none rounded-xl py-3 px-4 text-xl font-bold bg-white cursor-pointer">
                        <option value="polaroid">Polaroid</option>
                        <option value="10x15" selected>10x15</option>
                        <option value="a5">A5</option>
                        <option value="a4">A4</option>
                        <option value="a3">A3</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-calc-gray">
                        <svg class="fill-current h-6 w-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>
            </div>

            <!-- Quantity Input -->
            <div>
                <label class="block text-sm font-bold text-calc-dark mb-1 ml-2 uppercase tracking-wider">Nechta rasm?</label>
                <input type="number" id="qty-input" min="0" max="10000" placeholder="0" 
                    class="tactile-input w-full rounded-xl py-3 px-4 text-2xl font-bold text-center text-musavvir-pink placeholder-gray-400" />
            </div>

            <!-- Interactive Element -->
            <button class="retro-btn w-full rounded-xl py-4 text-xl font-bold uppercase tracking-widest mt-4" onclick="placeOrder()">
                Buyurtma berish
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const formatSelect = document.getElementById('format-select');
        const qtyInput = document.getElementById('qty-input');
        
        const displayFormat = document.getElementById('display-format');
        const displayUnitPrice = document.getElementById('display-unit-price');
        const displayPrice = document.getElementById('display-price');
        const deliveryBadge = document.getElementById('delivery-badge');

        // Number formatter for Uzbek sums (spaces between thousands)
        const formatter = new Intl.NumberFormat('ru-RU');
        
        // Confetti State
        let hasFiredConfetti = false;

        // Logic function
        function calculate() {
            // Get values
            const format = formatSelect.options[formatSelect.selectedIndex].text;
            let qty = parseInt(qtyInput.value);
            
            // Limit logic (prevent NaN and negative numbers)
            if (isNaN(qty) || qty < 0) {
                qty = 0;
            }

            // Pricing Rules based on image provided
            let pricePerItem = 0;
            
            if (qty > 0 && qty <= 50) {
                pricePerItem = 2000;
            } else if (qty >= 51 && qty <= 200) {
                pricePerItem = 1800;
            } else if (qty >= 201 && qty <= 300) {
                pricePerItem = 1700;
            } else if (qty >= 301 && qty <= 500) {
                pricePerItem = 1600;
            } else if (qty >= 501) {
                pricePerItem = 1500;
            }

            const totalPrice = qty * pricePerItem;

            // Update Screen UI
            displayFormat.textContent = formatSelect.value.toUpperCase();
            displayUnitPrice.textContent = pricePerItem > 0 ? formatter.format(pricePerItem) : '0';
            displayPrice.textContent = formatter.format(totalPrice);

            // Handle Delivery Badge Animation & Confetti
            if (qty >= 300) {
                // Show badge smoothly
                deliveryBadge.classList.remove('translate-y-full', 'opacity-0');
                deliveryBadge.classList.add('translate-y-0', 'opacity-100');
                
                // Fire Confetti only once when reaching the target
                if (!hasFiredConfetti) {
                    confetti({
                        particleCount: 150,
                        spread: 80,
                        origin: { y: 0.6 },
                        colors: ['#E90052', '#9CBA8F', '#F2EDE4', '#2c2c2c'],
                        disableForReducedMotion: true
                    });
                    hasFiredConfetti = true; // prevent infinite loops
                }
            } else {
                // Hide badge smoothly
                deliveryBadge.classList.add('translate-y-full', 'opacity-0');
                deliveryBadge.classList.remove('translate-y-0', 'opacity-100');
                
                // Reset confetti state so it fires again if they drop below 300 and go back up
                hasFiredConfetti = false;
            }
        }

        // Action for the bottom button
        function placeOrder() {
            // Add a little haptic vibration if supported on mobile
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
            // Redirect to Telegram
            window.open('https://t.me/AzizaxonOmonova', '_blank');
        }

        // Event Listeners
        formatSelect.addEventListener('change', calculate);
        qtyInput.addEventListener('input', calculate);
        
        // Initial Calculation on load
        calculate();
    </script>
